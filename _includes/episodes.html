<div class="container">
  {% if page.layout == "home" %}
    <div class="row">
      <div class="col-sm-12">
        <h2>Episodes</h2>
      </div>
    </div>
  {% endif %}
  <div class="row">
    <div class="col-sm-12">
      <div class="card-group">
        {% for post in site.posts %}
          <div class="col-12 col-sm-12 col-md-6 col-lg-4 col-xl-4 d-flex align-items-stretch">
            <div class="card mx-2 mb-3 drop-shadow2">
              <div class="card-body">
                {% if post.img-feat %}
                  <img
                    src="{{ site.baseurl }}/assets/img/people/{{ post.img-feat }}"
                    alt="{{ post.title }}"
                    class="mb-3 drop-shadow border rounded-circle md">
                {% endif %}
                <h3 class="h4">
                  <a href="{{ site.baseurl }}{{ post.url }}" class="stretched-link link-primary link-offset-3 link-underline-opacity-0 link-underline-opacity-0-hover">
                    {{ post.title }}
                  </a>
                </h3>
                <p class="small text-body-secondary mb-0">
                  <small>{{ post.description }}</small>
                </p>
              </div>
              {% if post.number %}
                <div class="card-footer text-body-secondary small">
                  Episode #{{ post.number }}</div>
              {% endif %}
            </div>
          </div>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
