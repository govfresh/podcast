{% if page.layout == "episode" %}
  <figure>
    <img
      {% if page.img-cover %}
      src="{{ site.baseurl }}/assets/img/people/{{ page.img-cover }}"
      {% else %}
      src="{{ site.baseurl }}/assets/img/avatar.png"
      {% endif %}
      alt="{{ page.img-alt }}"
      type="{{ page.folder }}"
      class="mb-3 drop-shadow border xxl">
    {% if page.img-caption %}
      <figcaption>
        <p class="small text-body-secondary mb-4">
          <small>
            {% if page.img-link %}
              <a href="{{ site.baseurl }}{{ page.img-link }}" class="nav-link text-body-secondary link-body-emphasis link-offset-3">
            {% endif %}
            {{ page.img-caption }}
            {% if page.img-link %}
              </a>
            {% endif %}
          </small>
        </p>
      </figcaption>
    {% endif %}
  </figure>
{% endif %}
